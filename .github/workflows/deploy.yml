name: Deploy Avalonia WASM to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install WASM workload
        run: dotnet workload install wasm-tools --skip-manifest-update

      # 1. Publish using the default output path so the SDK's static web asset
      # copy step (index.html, main.js, app.css) behaves correctly.
      - name: Publish App
        run: dotnet publish SolitaireUI/SolitaireUI.Browser/SolitaireUI.Browser.csproj -c Release

      # 2. Debug: show what actually got published so we can catch missing/misplaced files
      - name: List published output
        run: find SolitaireUI/SolitaireUI.Browser/bin/Release/net10.0-browser/publish/wwwroot -maxdepth 3 | sort

      # 3. Creates the file GitHub Pages needs to skip Jekyll processing
      - name: Create .nojekyll
        run: touch SolitaireUI/SolitaireUI.Browser/bin/Release/net10.0-browser/publish/wwwroot/.nojekyll

      # 4. Uploads the real publish output
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'SolitaireUI/SolitaireUI.Browser/bin/Release/net10.0-browser/publish/wwwroot'

      # 5. Pushes live
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
